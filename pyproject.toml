[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-powered-resume-scorer"
version = "1.0.0"
description = "AI-Powered Resume Scorer comparing resumes against job descriptions with semantic similarity, skill matching, and actionable improvement tips."
authors = [{ name = "AI Resume Scorer Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "python-multipart>=0.0.9",
    "pypdf>=4.1.0",
    "python-docx>=1.1.0",
    "sentence-transformers>=2.5.0",
    "torch>=2.2.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
